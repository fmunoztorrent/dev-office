# Runs the test suite on every push and pull request, on the platforms and Node versions the
# package supports (package.json: "os" darwin/linux, "engines" node >= 22.13), and a new user's
# install with each agent. On main, once everything is green, a new version (package.json) is
# released by itself: its tag and its GitHub release, with its CHANGELOG section as the notes.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # A new user's install, once per agent (scripts/install-check.mjs): the installer, the command in a
  # new terminal, doctor, the MCP server, a real run of the agent reaching the office, reinstalling
  # and uninstalling. The agents are installed with npm; no login is needed.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g --no-audit --no-fund @anthropic-ai/claude-code @earendil-works/pi-coding-agent opencode-ai
      - run: node scripts/install-check.mjs --json install-check.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-check-${{ matrix.os }}
          path: install-check.json

  # The release: nobody has to tag anything by hand. A push to main whose package.json version has no
  # tag yet gets it (vX.Y.Z), and its GitHub release, marked as the latest. `update` installs the
  # highest tag (or main, if main is newer), so every user gets it with a plain `dev-team-office update`.
  release:
    needs: [test, install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag and publish the version on main, if it is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then echo "$v is already released"; exit 0; fi
          awk -v v="${v#v}" '$0 ~ "^## \\[" v "\\]" { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md" > notes.md
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --notes-file notes.md --latest
